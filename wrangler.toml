# Deploying your own instance? `name`, `database_id`, and the KV `id` below
# are all this deployment's own (Fraai Agency) — replace them with your own
# before deploying. See README.md's "Deploying your own instance" for the
# exact `wrangler d1 create` / `wrangler kv namespace create` commands.
#
# No custom domain is configured here on purpose — `npm run deploy` gives
# every deployment a free workers.dev URL by default. To bind a custom
# domain instead, set WORKER_DOMAIN in your shell before deploying, e.g.
# `WORKER_DOMAIN=todo.example.com npm run deploy` (see the deploy script in
# package.json). Not a secret, so it isn't in .dev.vars/wrangler secret —
# it's a deploy-time flag, not something the Worker reads at runtime.
name = "todo-fraai-agency"
main = "src/worker-entry.ts"
compatibility_date = "2026-09-01"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "todo-fraai-agency"
database_id = "8d2c2a24-7e00-406b-91a6-dd0d9f8c0e5e"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION"
id = "023179a11a59446aabd8e6799d27e066"

# Push-notification sweep for tasks with a due_time — see worker-entry.ts
# and lib/notify-sweep.ts. 5 minutes is granular enough for a due-time
# reminder without hammering D1/the push services every request.
[triggers]
crons = ["*/5 * * * *"]
